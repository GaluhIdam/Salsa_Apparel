name: salsa-apparel

x-app: &app
  image: salsa-apparel-php:local
  pull_policy: build
  build:
    context: .
    target: app
  environment:
    APP_ENV: ${SALSA_APP_ENV:-local}
    APP_DEBUG: ${SALSA_APP_DEBUG:-false}
    APP_URL: ${SALSA_APP_URL:-http://localhost:9123}
    SESSION_NAME: salsa_session
    MAIL_DRIVER: ${SALSA_MAIL_DRIVER:-log}
    MAIL_FROM_ADDRESS: ${SALSA_MAIL_FROM_ADDRESS:-no-reply@example.com}
    MAIL_FROM_NAME: ${SALSA_MAIL_FROM_NAME:-Salsa Apparel}
    MAIL_HOST: ${SALSA_MAIL_HOST:-}
    MAIL_PORT: ${SALSA_MAIL_PORT:-587}
    MAIL_USERNAME: ${SALSA_MAIL_USERNAME:-}
    MAIL_PASSWORD: ${SALSA_MAIL_PASSWORD:-}
    PAYMENT_PROVIDER: midtrans
    MIDTRANS_SERVER_KEY: ${SALSA_MIDTRANS_SERVER_KEY:-}
    MIDTRANS_CLIENT_KEY: ${SALSA_MIDTRANS_CLIENT_KEY:-}
    MIDTRANS_IS_PRODUCTION: ${SALSA_MIDTRANS_IS_PRODUCTION:-false}
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${SALSA_DB_DATABASE:-salsa_apparel}
    DB_USERNAME: ${SALSA_DB_USERNAME:-salsa_app}
    DB_PASSWORD: ${SALSA_DB_PASSWORD:-salsa_local_development}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SALSA_DB_DATABASE:-salsa_apparel}
      POSTGRES_USER: ${SALSA_DB_USERNAME:-salsa_app}
      POSTGRES_PASSWORD: ${SALSA_DB_PASSWORD:-salsa_local_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    <<: *app
    restart: "no"
    command: ["sh", "-c", "php scripts/migrate.php && php scripts/seed.php"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    restart: unless-stopped
    volumes:
      - uploads:/var/www/html/public/uploads
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    image: salsa-apparel-nginx:local
    pull_policy: build
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "${SALSA_HTTP_BIND:-127.0.0.1}:${SALSA_HTTP_PORT:-9123}:80"
    volumes:
      - uploads:/var/www/html/public/uploads:ro
    depends_on:
      app:
        condition: service_started

volumes:
  postgres_data:
  uploads:
  storage:
